<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>THE ARCHIVE — 3D Room Escape: Treaty of Hudaibiyah</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js & OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Chosen Palette: Warm Antique Amber, Obsidian, Roasted Mahogany & Aged Brass -->
  <!-- Application Structure Plan: Full 6-sided interior escape room enclosures with dynamic viewport height (100dvh) mobile HUD layout. Dedicated touch-optimized Floating Action Button (FAB) guarantees door lock modal accessibility across all mobile devices regardless of viewport size or browser toolbar overflow. Full 360° interactive 3D inspection, procedural high-res canvas textures, audio synth, and passcode-protected admin director mode. -->
  <!-- Visualization & Content Choices: Three.js WebGL 3D Enclosure + Procedural Canvas Textures -> Lock Dial Markings, Parchment, Seals & Inscription Magnifier -> 360° Dynamic Inspector + Mobile Touch Controls (NO SVG, NO MERMAID). -->
  <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

  <style>
    :root {
      --amber: #e0a94f;
      --amber-bright: #ffd275;
      --bg-dark: #060712;
      --card-bg: rgba(12, 14, 30, 0.95);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
      touch-action: none;
    }

    #webgl-container, #inspector-canvas-container {
      position: absolute;
      inset: 0;
      z-index: 0;
      outline: none;
      touch-action: none;
    }
    #webgl-container canvas, #inspector-canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    .dragging canvas {
      cursor: grabbing !important;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      box-shadow: inset 0 0 140px 60px rgba(0, 0, 0, 0.92);
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(224, 169, 79, 0.35);
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    }

    .glass-pill {
      background: rgba(8, 10, 22, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .orbit-hint {
      animation: floatHint 3s ease-in-out infinite;
    }
    @keyframes floatHint {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -5px); }
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: scale(0.95) translateY(15px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-modal {
      animation: modalSlide 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(8, 10, 22, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(224,169,79,0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(224,169,79,0.8); }
  </style>
</head>
<body class="relative w-full h-full h-[100dvh] overflow-hidden select-none">

  <!-- 3D WebGL Interior Room Container -->
  <div id="webgl-container"></div>
  <div class="vignette"></div>

  <!-- Dynamic 3D Object Hover Tooltip -->

    <!-- Top Bar Navigation HUD -->

    <!-- Bottom HUD Bar: Chamber Status & Room Inventory -->
    <footer class="w-full max-w-5xl mx-auto flex flex-col items-center gap-1.5 pointer-events-auto">
      
      <!-- Chamber Progress Card -->
      <div class="w-full glass-card p-2.5 sm:p-4 rounded-2xl flex flex-col gap-2 border border-amber-500/30 shadow-2xl">
        
        <!-- Active Room Info + Dedicated Chamber Door Lock Button -->

              1
            </div>
            <div class="min-w-0 flex-1">

            </div>

          <!-- PRIMARY CHAMBER DOOR LOCK BUTTON (ALWAYS VISIBLE & HIGH-PRIORITY) -->

            <span>🔓</span>

          </button>
        </div>

        <!-- Inventory Item Slots Row -->
        <div class="flex items-center gap-1.5 overflow-x-auto w-full no-scrollbar pt-1 border-t border-slate-800/80" id="inventoryContainer">

        </div>

      <!-- Footer Bar with Hidden Admin Lock Trigger -->
      <div class="flex items-center justify-between w-full px-2 text-[9px] text-slate-500">
        <span class="truncate">Treaty of Hudaibiyah Historical Archive</span>
        <button onclick="promptAdminLogin()" class="hover:text-amber-400/80 transition flex items-center gap-1 focus:outline-none shrink-0 ml-2 py-0.5">
          <span>🔒</span> Admin Access
        </button>
      </div>
    </footer>
  </div>

  <!-- FLOATING TOUCH ACTION BUTTON FOR MOBILE DEVICES (100% VISIBILITY GUARANTEE) -->
  <button onclick="openChamberLockModal()" class="fixed bottom-20 right-3 z-30 sm:hidden bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black p-3 rounded-full shadow-2xl border-2 border-amber-300 flex items-center justify-center active:scale-90 transition" title="Open Door Lock Quiz">
    <span class="text-xl">🔓</span>
  </button>

  <!-- MODAL CONTAINER (Inspectors, Door Padlock, Quizzes, Certificates, Admin) -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 hidden bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-4">
    <div id="modalContent" class="glass-card w-full max-w-xl max-h-[88vh] overflow-y-auto rounded-2xl p-4 sm:p-6 relative border border-amber-500/40 animate-modal text-slate-100">
      <!-- Dynamic Content Injected Here -->
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* =========================================================================
       1. GLOBAL HISTORICAL REPORT DATA
       ========================================================================= */
    const DEFAULT_CASE = {
      id: "hudaibiyah_628",
      title: "Treaty of Hudaibiyah (628 CE) — Room Escape Case",
      missions: [
        {
          id: "m1",
          title: "Bedouin Tent Enclosure",
          theme: "desert_room",
          clueItemName: "Sheathed Pilgrim Dagger",
          clueIcon: "🗡️",
          unlockWord: "1400",
          story: "Inside this Bedouin tent enclosure, 1,400 Muslims encamped at Hudaibiyah in March 628 CE. Clad only in white pilgrim garments (Ihram), they carried no weapons of war—only sheathed travel daggers.",
          question: "Examine the sheath engraving on the Pilgrim Dagger sitting on the wooden table inside the room. How many unarmed pilgrims marched to Hudaibiyah?",
          options: ["500 Pilgrims", "1,400 Pilgrims", "3,000 Pilgrims", "10,000 Pilgrims"],
          correctOpt: 1
        },
        {

          title: "Diplomatic Negotiating Room",
          theme: "pavilion_room",
          clueItemName: "Diplomatic Treaty Scroll",
          clueIcon: "📜",
          unlockWord: "SUHAIL",
          story: "This carpeted diplomatic chamber hosted delicate negotiations between Muslim emissaries and Qurayshi envoy Suhail ibn Amr. Strategic compromises ensured a historic non-aggression truce.",
          question: "Inspect the Parchment Scroll lying on the mahogany writing desk. Who was the chief Qurayshi envoy whose signature and red wax seal bind this pact?",
          options: ["Abu Sufyan", "Suhail ibn Amr", "Ikrimah ibn Abi Jahl", "Khalid ibn al-Walid"],
          correctOpt: 1
        },
        {
          id: "m3",
          title: "Courtyard of Bay'at al-Ridwan",
          theme: "courtyard_room",
          clueItemName: "Silver Signet Seal Ring",
          clueIcon: "💍",
          unlockWord: "RIDWAN",
          story: "Inside this stone courtyard with an ancient acacia planter, companions swore a sacred oath of unity and allegiance under the tree ('Bay'at al-Ridwan') when diplomatic rumors spread.",
          question: "Inspect the Silver Signet Ring resting on the stone table cushion. What was this historic pledge of divine satisfaction called?",
          options: ["Bay'at al-Aqabah", "Bay'at al-Ridwan", "Pact of Madinah", "Pledge of Ta'if"],
          correctOpt: 1
        },
        {
          id: "m4",
          title: "Fortress Truce Gate Room",
          theme: "gate_room",
          clueItemName: "Heavy Iron Door Lock",
          clueIcon: "🔒",
          unlockWord: "10",
          story: "This stone fortress room controls access to Makkah. The Treaty of Hudaibiyah guaranteed a 10-year armistice, ending hostilities and allowing peaceful trade across Arabia.",
          question: "Examine the engraved combination dial on the Heavy Iron Door Lock. Select the door lock code matching the exact number of years of armistice guaranteed by the treaty.",
          options: ["3 Years", "5 Years", "10 Years", "20 Years"],
          correctOpt: 2
        },
        {
          id: "m5",
          title: "Sanctuary of Clear Victory Hall",
          theme: "sanctuary_room",
          clueItemName: "Manifest Victory Plaque",
          clueIcon: "🏺",
          unlockWord: "VICTORY",
          story: "This high-arched marble sanctuary honors the revelation of Surah Al-Fath: 'Verily, We have granted you a Clear Victory.' Peace enabled more people to enter Islam in 2 years than in 19 previous years.",
          question: "Inspect the golden calligraphy plaque on the marble pedestal. Which Surah proclaimed the Treaty a 'Manifest Victory'?",
          options: ["Surah Al-Baqarah", "Surah Al-Fath", "Surah Al-Anfal", "Surah Al-Tawbah"],
          correctOpt: 1
        }
      ]
    };

    let activeCase = JSON.parse(localStorage.getItem('archive_room_case_v1')) || DEFAULT_CASE;
    let currentState = {
      currentMissionIdx: 0,
      collectedItems: [],
      audioEnabled: true
    };

    let badgeClickCount = 0;
    let badgeClickTimer = null;

    /* =========================================================================
       2. SYNTHESIZED WEB AUDIO FX
       ========================================================================= */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleAudio() {
      currentState.audioEnabled = !currentState.audioEnabled;
      document.getElementById('soundStatusText').innerText = currentState.audioEnabled ? "Sound ON" : "Sound OFF";
      document.getElementById('soundIcon').innerText = currentState.audioEnabled ? "🔊" : "🔇";
      if (currentState.audioEnabled) playSynthSound(523.25, 'sine', 0.1);
    }

    function playSynthSound(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (!currentState.audioEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.error(e); }
    }

    function playSuccessChime() {
      if (!currentState.audioEnabled) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        setTimeout(() => playSynthSound(f, 'triangle', 0.25, 0.15), i * 90);
      });
    }

    function playErrorBuzz() {
      if (!currentState.audioEnabled) return;
      playSynthSound(140, 'sawtooth', 0.28, 0.2);
    }

    /* =========================================================================
       3. CANVAS 2D PROCEDURAL TEXTURE GENERATORS (HIGH-RES HD)
       ========================================================================= */

    function createScrollTextureCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(512, 512, 50, 512, 512, 600);
      grad.addColorStop(0, '#fbf3db');
      grad.addColorStop(0.7, '#e8d5a7');
      grad.addColorStop(1, '#c2a160');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.fillStyle = 'rgba(90, 60, 20, 0.05)';
      for (let i = 0; i < 5000; i++) {
        ctx.fillRect(Math.random() * 1024, Math.random() * 1024, Math.random() * 3 + 1, Math.random() * 3 + 1);
      }

      ctx.strokeStyle = '#8a5e2a';
      ctx.lineWidth = 14;
      ctx.strokeRect(30, 30, 964, 964);
      ctx.lineWidth = 4;
      ctx.strokeRect(48, 48, 928, 928);

      ctx.fillStyle = '#1c1007';
      ctx.textAlign = 'center';
      ctx.font = 'bold 38px Georgia, serif';
      ctx.fillText("TREATY OF HUDAIBIYAH (628 CE)", 512, 115);

      ctx.font = 'italic 22px serif';
      ctx.fillStyle = '#4a3219';
      ctx.fillText("Official Peace Pact & 10-Year Armistice Agreement", 512, 150);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#26160a';
      ctx.font = '500 21px Georgia, serif';
      const lines = [
        "In the Name of Allah. Peaceful pact between Muslims & Quraysh.",
        "1. Hostilities between both parties shall cease for ten years.",
        "2. Anyone wishing to enter an alliance with either side may do so.",
        "3. Absolute safety of trade routes, pilgrims, and envoys guaranteed.",
        "4. Sealed and witnessed by delegates at Al-Hudaibiyah."
      ];
      lines.forEach((line, idx) => {
        ctx.fillText(line, 80, 225 + idx * 45);
      });

      ctx.save();
      ctx.translate(512, 650);

      const waxGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 180);
      waxGrad.addColorStop(0, '#e03131');
      waxGrad.addColorStop(0.7, '#9e1818');
      waxGrad.addColorStop(1, '#520d0d');
      ctx.fillStyle = waxGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 175, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ff6b6b';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(0, 0, 152, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#ffe066';
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px Georgia, serif';
      ctx.fillText("OFFICIAL QURAYSHI SEAL", 0, -60);

      ctx.font = '900 68px Georgia, serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 12;
      ctx.fillText("SUHAIL", 0, 20);

      ctx.font = 'bold 24px serif';
      ctx.fillStyle = '#fff3bf';
      ctx.shadowBlur = 0;
      ctx.fillText("Chief Envoy • Suhail ibn Amr", 0, 78);

      ctx.restore();
      return canvas;
    }

    function createDaggerTextureCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 1024, 0);
      grad.addColorStop(0, '#9e732b');
      grad.addColorStop(0.5, '#ffd275');
      grad.addColorStop(1, '#735017');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.strokeStyle = '#2e1c03';
      ctx.lineWidth = 20;
      ctx.strokeRect(30, 30, 964, 964);

      ctx.fillStyle = '#1a1002';
      ctx.textAlign = 'center';
      ctx.font = 'bold 64px Georgia, serif';
      ctx.fillText("PILGRIM DAGGER", 512, 240);

      ctx.font = 'black 180px Impact, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 25;
      ctx.fillText("1400", 512, 540);

      ctx.font = 'bold 46px Georgia, serif';
      ctx.fillStyle = '#2b1a03';
      ctx.shadowBlur = 0;
      ctx.fillText("UNARMED PILGRIMS MARCH", 512, 720);

      return canvas;
    }

    function createRingTextureCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createRadialGradient(512, 512, 40, 512, 512, 480);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.6, '#cbd5e1');
      grad.addColorStop(1, '#475569');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(512, 512, 420, 280, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 14;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '900 130px Georgia, serif';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 20;
      ctx.fillText("RIDWAN", 512, 540);

      ctx.font = 'bold 44px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.shadowBlur = 0;
      ctx.fillText("BAY'AT AL-RIDWAN PLEDGE", 512, 670);

      return canvas;
    }

    function createPlaqueTextureCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
      grad.addColorStop(0, '#ffe066');
      grad.addColorStop(0.5, '#d9a000');
      grad.addColorStop(1, '#805e00');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.strokeStyle = '#3d2d00';
      ctx.lineWidth = 28;
      ctx.strokeRect(40, 40, 944, 944);

      ctx.fillStyle = '#1c1700';
      ctx.textAlign = 'center';
      ctx.font = 'bold 68px Georgia, serif';
      ctx.fillText("SURAH AL-FATH (48:1)", 512, 220);

      ctx.font = 'black 100px Georgia, serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 25;
      ctx.fillText("CLEAR VICTORY", 512, 480);

      ctx.font = 'italic 46px Georgia, serif';
      ctx.fillStyle = '#211c00';
      ctx.shadowBlur = 0;
      ctx.fillText('"Verily, We have granted you', 512, 650);
      ctx.fillText('a Manifest Victory."', 512, 730);

      return canvas;
    }

    function createPadlockTextureCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 1024, 1024);
      bgGrad.addColorStop(0, '#334155');
      bgGrad.addColorStop(0.5, '#1e293b');
      bgGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 24;
      ctx.strokeRect(30, 30, 964, 964);

      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 8;
      ctx.strokeRect(50, 50, 924, 924);

      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'center';
      ctx.font = 'bold 58px Georgia, serif';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 10;
      ctx.fillText("FORTRESS TRUCE GATE LOCK", 512, 150);

      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.shadowBlur = 0;
      ctx.fillText("ARMISTICE DURATION CODE", 512, 210);

      ctx.fillStyle = '#020617';
      ctx.fillRect(120, 280, 784, 480);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 6;
      ctx.strokeRect(120, 280, 784, 480);

      const wheelX = [250, 512, 770];
      const numbers = ["1", "0", "YRS"];

      wheelX.forEach((x, idx) => {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x - 100, 320, 200, 400);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 4;
        ctx.strokeRect(x - 100, 320, 200, 400);

        ctx.fillStyle = '#ffffff';
        ctx.font = idx === 2 ? '900 80px Impact, sans-serif' : '900 180px Impact, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 30;
        ctx.fillText(numbers[idx], x, idx === 2 ? 550 : 580);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#64748b';
        ctx.fillRect(x - 80, 340, 160, 12);
        ctx.fillRect(x - 80, 680, 160, 12);
      });

      ctx.fillStyle = '#fef08a';
      ctx.font = '900 64px Georgia, serif';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 15;
      ctx.fillText("COMBINATION CODE: 10 YEARS", 512, 870);

      ctx.font = 'italic 34px Georgia, serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.shadowBlur = 0;
      ctx.fillText("10-Year Non-Aggression Truce Pact (628 CE)", 512, 940);

      return canvas;
    }


    /* =========================================================================
       4. THREE.JS 3D ROOM ARCHITECTURE ENGINE (ISOLATED & BOUNDED ROOM ENCLOSURE)
       ========================================================================= */
    let scene, camera, renderer, controls;
    let roomGroup = null;
    let interactiveObjects = [];
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let hoveredObject = null;
    let roomLights = [];

    let inspectorScene, inspectorCamera, inspectorRenderer, inspectorControls;

    function init3D() {
      const container = document.getElementById('webgl-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x04050a);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 12);
      camera.position.set(0, 1.6, 2.2);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      controls.minDistance = 0.6;
      controls.maxDistance = 3.2;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minPolarAngle = Math.PI / 6;
      controls.target.set(0, 1.1, -0.2);

      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('mousemove', onMouseMove);
      renderer.domElement.addEventListener('click', onCanvasClick);
      renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });

      renderer.domElement.addEventListener('mousedown', () => {
        container.classList.add('dragging');
        document.getElementById('orbitHint')?.classList.add('opacity-0');
      });
      renderer.domElement.addEventListener('mouseup', () => {
        container.classList.remove('dragging');
      });

      loadRoomArchitecture(currentState.currentMissionIdx);
      animate();
    }

    function clearCurrentRoom() {
      if (roomGroup) {
        roomGroup.traverse((child) => {
          if (child.isMesh) {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
              else child.material.dispose();
            }
          }
        });
        scene.remove(roomGroup);
        roomGroup = null;
      }
      interactiveObjects = [];
      roomLights = [];
    }

    function loadRoomArchitecture(missionIdx) {
      clearCurrentRoom();

      roomGroup = new THREE.Group();
      const mission = activeCase.missions[missionIdx];
      const theme = mission ? mission.theme : 'desert_room';

      const rx = 7.0, ry = 4.5, rz = 7.0;

      let wallColor = 0x241d18, floorColor = 0x3d2719;
      if (theme === 'pavilion_room') { wallColor = 0x3d1c1d; floorColor = 0x541720; }
      else if (theme === 'courtyard_room') { wallColor = 0x222633; floorColor = 0x171924; }
      else if (theme === 'gate_room') { wallColor = 0x1c202e; floorColor = 0x12141f; }
      else if (theme === 'sanctuary_room') { wallColor = 0x12182b; floorColor = 0x0a0f1e; }

      const roomBoxGeo = new THREE.BoxGeometry(rx, ry, rz);
      const roomBoxMat = new THREE.MeshStandardMaterial({
        color: wallColor,
        roughness: 0.85,
        side: THREE.BackSide
      });
      const roomShell = new THREE.Mesh(roomBoxGeo, roomBoxMat);
      roomShell.position.set(0, ry / 2, 0);
      roomShell.receiveShadow = true;
      roomGroup.add(roomShell);

      const floorGeo = new THREE.PlaneGeometry(rx - 0.05, rz - 0.05);
      const floorMat = new THREE.MeshStandardMaterial({ color: floorColor, roughness: 0.6 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0.01;
      floor.receiveShadow = true;
      roomGroup.add(floor);

      for (let b = -2.8; b <= 2.8; b += 2.0) {
        const beamGeo = new THREE.BoxGeometry(0.3, 0.3, rz - 0.1);
        const beamMat = new THREE.MeshStandardMaterial({ color: 0x1a110a, roughness: 0.8 });
        const beam = new THREE.Mesh(beamGeo, beamMat);
        beam.position.set(b, ry - 0.15, 0);
        beam.castShadow = true;
        roomGroup.add(beam);
      }

      const lanternGeo = new THREE.CylinderGeometry(0.22, 0.3, 0.6, 12);
      const lanternMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.2 });
      const lantern = new THREE.Mesh(lanternGeo, lanternMat);
      lantern.position.set(0, ry - 1.0, 0);
      roomGroup.add(lantern);

      const chainGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.8, 8);
      const chain = new THREE.Mesh(chainGeo, lanternMat);
      chain.position.set(0, ry - 0.4, 0);
      roomGroup.add(chain);

      const roomLight = new THREE.PointLight(0xffa844, 2.6, 9.0);
      roomLight.position.set(0, ry - 1.2, 0);
      roomLight.castShadow = true;
      roomGroup.add(roomLight);
      roomLights.push(roomLight);

      const ambLight = new THREE.AmbientLight(0xdbe4ff, 0.5);
      roomGroup.add(ambLight);

      if (theme === 'desert_room') buildDesertRoomInterior(roomGroup);
      else if (theme === 'pavilion_room') buildPavilionRoomInterior(roomGroup);
      else if (theme === 'courtyard_room') buildCourtyardRoomInterior(roomGroup);
      else if (theme === 'gate_room') buildGateRoomInterior(roomGroup);
      else buildSanctuaryRoomInterior(roomGroup);

      scene.add(roomGroup);

      camera.position.set(0, 1.6, 2.2);
      controls.target.set(0, 1.1, -0.2);
      controls.update();
    }

    function createHDTexture(canvas) {

      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      texture.needsUpdate = true;
      return texture;
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      checkIntersects(event.clientX, event.clientY);
    }

    function onTouchStart(event) {
      if (event.touches.length === 1) {
        const touch = event.touches[0];
        mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
        
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactiveObjects, true);

        if (intersects.length > 0) {
          let obj = intersects[0].object;
          while (obj.parent && !obj.userData.name) obj = obj.parent;
          if (obj.userData && obj.userData.name) {
            hoveredObject = obj;
            onCanvasClick();
          }
        }
      }
    }

    function checkIntersects(clientX, clientY) {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects, true);
      const tooltip = document.getElementById('hoverTooltip');

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && !obj.userData.name) obj = obj.parent;

        if (obj.userData && obj.userData.name) {
          hoveredObject = obj;
          document.body.style.cursor = 'pointer';
          tooltip.classList.remove('hidden');
          tooltip.style.left = `${clientX}px`;
          tooltip.style.top = `${clientY}px`;
          document.getElementById('tooltipIcon').innerText = obj.userData.icon || "🔍";
          document.getElementById('tooltipText').innerText = `${obj.userData.name} (Tap to Inspect)`;
          return;
        }
      }

      hoveredObject = null;
      document.body.style.cursor = 'default';
      tooltip.classList.add('hidden');
    }

    function onCanvasClick() {
      if (hoveredObject && hoveredObject.userData.name) {
        playSynthSound(650, 'sine', 0.12);
        
        if (!currentState.collectedItems.includes(hoveredObject.userData.name)) {
          currentState.collectedItems.push(hoveredObject.userData.name);
          updateHUD();
        }

        open3DInspectorModal(hoveredObject.userData);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (roomLights.length > 0) {
        roomLights.forEach(light => {
          light.intensity = 2.4 + Math.sin(Date.now() * 0.008) * 0.35 + (Math.random() - 0.5) * 0.08;
        });
      }

      interactiveObjects.forEach(obj => {
        obj.rotation.y += 0.004;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    function drawMagnifiedSignature(itemData) {
      const magCanvas = document.getElementById('magnifiedCanvas');
      if (!magCanvas) return;
      
      let sourceCanvas;
      if (itemData.signatureType === 'scroll' || itemData.name.includes("Scroll")) {
        sourceCanvas = createScrollTextureCanvas();
      } else if (itemData.signatureType === 'dagger' || itemData.name.includes("Dagger")) {
        sourceCanvas = createDaggerTextureCanvas();
      } else if (itemData.signatureType === 'ring' || itemData.name.includes("Ring")) {
        sourceCanvas = createRingTextureCanvas();
      } else if (itemData.signatureType === 'lock' || itemData.name.includes("Lock")) {
        sourceCanvas = createPadlockTextureCanvas();
      } else {
        sourceCanvas = createPlaqueTextureCanvas();
      }

      magCanvas.width = sourceCanvas.width;
      magCanvas.height = sourceCanvas.height;
      const ctx = magCanvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0);
    }

    function initInspector3DCanvas(itemData) {
      const container = document.getElementById('inspector-canvas-container');
      if (!container) return;

      inspectorScene = new THREE.Scene();
      inspectorScene.background = new THREE.Color(0x0a0c18);

      const aspect = container.clientWidth / container.clientHeight;
      inspectorCamera = new THREE.PerspectiveCamera(40, aspect, 0.1, 50);

      inspectorRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      inspectorRenderer.setSize(container.clientWidth, container.clientHeight);
      inspectorRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      inspectorRenderer.toneMapping = THREE.ACESFilmicToneMapping;
      inspectorRenderer.toneMappingExposure = 1.35;
      container.appendChild(inspectorRenderer.domElement);

      inspectorControls = new THREE.OrbitControls(inspectorCamera, inspectorRenderer.domElement);
      inspectorControls.enableDamping = true;
      inspectorControls.dampingFactor = 0.08;
      inspectorControls.autoRotate = true;
      inspectorControls.autoRotateSpeed = 1.8;
      inspectorControls.enableZoom = true;
      inspectorControls.minDistance = 0.8;
      inspectorControls.maxDistance = 4.5;

      inspectorControls.addEventListener('start', () => { inspectorControls.autoRotate = false; });

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
      keyLight.position.set(2, 4, 6);
      inspectorScene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x76a0d0, 1.8);
      rimLight.position.set(-4, 3, -4);
      inspectorScene.add(rimLight);

      const fillLight = new THREE.DirectionalLight(0xffecd1, 1.6);
      fillLight.position.set(-3, -2, 3);
      inspectorScene.add(fillLight);

      const ambLight = new THREE.AmbientLight(0xffffff, 0.9);
      inspectorScene.add(ambLight);

      let clonedItem;
      let camDistance = 2.0;

      if (itemData.name.includes("Scroll")) {
        clonedItem = create3DParchmentScroll();
        clonedItem.rotation.x = 0.2;
        camDistance = 1.9;
      } else if (itemData.name.includes("Dagger")) {
        clonedItem = create3DPilgrimDagger();
        clonedItem.rotation.y = Math.PI / 4;
        camDistance = 1.7;
      } else if (itemData.name.includes("Ring")) {
        clonedItem = create3DSilverSignetRing();
        clonedItem.scale.set(1.8, 1.8, 1.8);
        camDistance = 1.6;
      } else if (itemData.name.includes("Lock")) {
        clonedItem = create3DCombinationPadlock();
        clonedItem.scale.set(1.6, 1.6, 1.6);
        camDistance = 1.5;
      } else {
        clonedItem = create3DCalligraphyPlaque();
        camDistance = 1.8;
      }

      clonedItem.position.set(0, 0, 0);
      inspectorScene.add(clonedItem);

      inspectorCamera.position.set(0, 0.1, camDistance);
      inspectorControls.target.set(0, 0, 0);
      inspectorControls.update();

      function animateInspector() {
        if (!document.getElementById('inspector-canvas-container')) return;
        requestAnimationFrame(animateInspector);
        inspectorControls.update();
        inspectorRenderer.render(inspectorScene, inspectorCamera);
      }
      animateInspector();
    }


    /* =========================================================================
       6. CHAMBER DOOR LOCK & QUIZ CONTROLLER
       ========================================================================= */

    function updateHUD() {
      const mission = activeCase.missions[currentState.currentMissionIdx];
      document.getElementById('hudCaseTitle').innerText = activeCase.title;
      document.getElementById('missionBadge').innerText = currentState.currentMissionIdx + 1;
      document.getElementById('missionTitleText').innerText = `Room ${currentState.currentMissionIdx + 1}: ${mission.title}`;

      const invContainer = document.getElementById('inventoryContainer');
      invContainer.innerHTML = activeCase.missions.map((m, idx) => {
        const isCollected = currentState.collectedItems.includes(m.clueItemName);
        return `
          <button ${isCollected ? `onclick="inspectInventoryItem('${m.clueItemName}')"` : `onclick="handleUncollectedItemClick(${idx + 1})"`} 
            class="px-2.5 py-1 rounded-xl text-[10px] sm:text-[11px] font-bold flex items-center gap-1 transition shrink-0 ${
            isCollected 
              ? 'bg-amber-500/20 border border-amber-400 text-amber-300 shadow-md hover:bg-amber-500/30 cursor-pointer' 
              : 'bg-slate-900/60 border border-slate-800 text-slate-500 opacity-50 cursor-pointer'
          }">
            <span>${isCollected ? m.clueIcon : '🔒'}</span>
            <span class="whitespace-nowrap">${isCollected ? m.clueItemName : `Room ${idx + 1}`}</span>
          </button>
        `;
      }).join('');
    }

    function handleUncollectedItemClick(roomNum) {
      playErrorBuzz();
      alert(`🔒 Artifact Locked: This object belongs to Room ${roomNum} and cannot be inspected until discovered.`);
    }

    function inspectInventoryItem(itemName) {
      if (!currentState.collectedItems.includes(itemName)) {
        playErrorBuzz();
        alert("🔒 Artifact Locked: You have not yet discovered this item!");
        return;
      }

      const mission = activeCase.missions.find(m => m.clueItemName === itemName);
      let inspectText = "Item stored in room inventory.";
      let inspectDetails = "Examine dial numbers, signatures, and inscriptions closely.";
      let signatureType = "plaque";

      if (itemName.includes("Scroll")) { 
        inspectText = "Parchment Scroll bearing the official Red Wax Seal and Signature of 'SUHAIL'."; 
        inspectDetails = "Suhail ibn Amr signed on behalf of the Quraysh, establishing a historic 10-year peace pact."; 
        signatureType = "scroll"; 
      } else if (itemName.includes("Dagger")) { 
        inspectText = "Brass Sheath Inscription: '1400 Unarmed Pilgrims March for Umrah (628 CE)'"; 
        inspectDetails = "Muslims brought only single travel daggers sheathed in leather to demonstrate their peaceful intent."; 
        signatureType = "dagger"; 
      } else if (itemName.includes("Ring")) { 
        inspectText = "Silver Ring inscribed with 'RIDWAN' and official seal."; 
        inspectDetails = "Commemorates the pledge under the acacia tree."; 
        signatureType = "ring"; 
      } else if (itemName.includes("Lock")) { 
        inspectText = "Iron Padlock with clear combination dial displaying '10' Years Armistice Code."; 
        inspectDetails = "Inspect the high-resolution dial face to confirm the 10-year truce duration code."; 
        signatureType = "lock"; 
      } else if (itemName.includes("Plaque")) { 
        inspectText = "Gold Calligraphy Plaque: 'Inna Fatahina Laka Fathan Mubeena' (Surah Al-Fath)"; 
        inspectDetails = "Proclaims the Treaty of Hudaibiyah as a Manifest Divine Victory."; 
        signatureType = "plaque"; 
      }

      open3DInspectorModal({
        name: itemName,
        icon: mission ? mission.clueIcon : "📜",
        inspectText: inspectText,
        inspectDetails: inspectDetails,
        signatureType: signatureType
      });
    }

    function openChamberLockModal() {
      const mission = activeCase.missions[currentState.currentMissionIdx];
      const backdrop = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        
        <div class="flex items-center gap-1.5 text-[10px] sm:text-xs uppercase font-black text-amber-400 tracking-wider mb-1">
          <span>🔓 Room ${currentState.currentMissionIdx + 1} Exit Door Mechanism</span>
        </div>
        <h2 class="text-base sm:text-xl font-black text-white mb-2">${mission.title}</h2>

        <div class="p-3 sm:p-4 rounded-xl bg-slate-900/80 border border-amber-500/20 text-slate-300 text-xs leading-relaxed mb-3">
          ${mission.story}
        </div>

        <div class="p-3 sm:p-4 rounded-xl bg-slate-900/90 border border-slate-700/80 mb-2">
          <label class="block text-[10px] sm:text-xs font-bold uppercase text-amber-400 mb-1.5">
            ❓ Door Key Code Challenge:
          </label>
          <p class="text-xs sm:text-sm text-slate-100 font-semibold mb-3">${mission.question}</p>

          <div class="grid grid-cols-1 gap-1.5 sm:gap-2">
            ${mission.options.map((opt, i) => `
              <button onclick="submitQuizAnswer(${i})" class="w-full text-left p-2.5 sm:p-3 rounded-lg bg-slate-800/80 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-400 text-xs font-semibold text-slate-200 hover:text-amber-300 transition flex items-center justify-between min-h-[44px]">
                <span><strong class="text-amber-400 mr-2">${String.fromCharCode(65 + i)}.</strong> ${opt}</span>
                <span>🔑</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;

      backdrop.classList.remove('hidden');
    }

    function submitQuizAnswer(optIdx) {
      const mission = activeCase.missions[currentState.currentMissionIdx];
      if (optIdx === mission.correctOpt) {
        playSuccessChime();
        if (!currentState.collectedItems.includes(mission.clueItemName)) {
          currentState.collectedItems.push(mission.clueItemName);
        }
        updateHUD();

        const content = document.getElementById('modalContent');
        const isLast = currentState.currentMissionIdx >= activeCase.missions.length - 1;

        content.innerHTML = `
          <div class="text-center py-4 sm:py-6">
            <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-400 text-emerald-400 text-2xl sm:text-3xl flex items-center justify-center mx-auto mb-3 animate-bounce">
              ✓
            </div>
            <h2 class="text-xl sm:text-2xl font-black text-emerald-300 mb-1.5">Chamber Door Unlocked!</h2>
            <p class="text-xs sm:text-sm text-slate-300 mb-5">You successfully deduced the historic key for <strong>"${mission.clueItemName}"</strong>.</p>

            ${isLast ? `
              <button onclick="showCertificate()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 font-bold text-slate-950 text-xs uppercase tracking-wider shadow-lg hover:shadow-amber-500/30 transition min-h-[44px]">
                🏆 View Final Escape Certificate & Report
              </button>
            ` : `
              <button onclick="nextMission()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 font-bold text-slate-950 text-xs uppercase tracking-wider shadow-lg hover:shadow-amber-500/30 transition min-h-[44px]">
                Enter Room ${currentState.currentMissionIdx + 2} &rarr;
              </button>
            `}
          </div>
        `;
      } else {
        playErrorBuzz();
        alert("Incorrect key combination! Inspect room props for historical evidence.");
      }
    }

    function nextMission() {
      closeModal();
      currentState.currentMissionIdx++;
      loadRoomArchitecture(currentState.currentMissionIdx);
      updateHUD();
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function showCertificate() {
      const backdrop = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        
        <div class="text-center p-2 border-2 border-amber-500/50 rounded-xl bg-slate-900/90">
          <div class="text-[10px] font-black uppercase text-amber-400 tracking-widest mb-1">Archive Completion Record</div>
          <h2 class="text-lg sm:text-2xl font-black text-white mb-1">${activeCase.title}</h2>
          <div class="text-xs text-slate-400 mb-3">3D Escape Room Case Solved</div>

          <div class="my-3 p-3 rounded-lg bg-amber-500/10 border border-amber-500/30 text-left text-xs text-slate-200 space-y-1.5">
            <p class="font-bold text-amber-300">🔑 Strategic Diplomacy Takeaways:</p>
            <ul class="list-disc pl-4 space-y-1 text-slate-300">
              <li>Patience over Provocation: Unarmed pilgrimage emphasized diplomatic goodwill.</li>
              <li>Flexibility in Form, Firmness in Substance: Compromising wording yielded long-term peace.</li>
              <li>Clear Victory: Post-pact armistice allowed Islam to expand exponentially.</li>
            </ul>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-[10px] sm:text-xs text-slate-400">
            <span>Status: <strong class="text-emerald-400">ALL ROOMS ESCAPED (100%)</strong></span>
            <span>Items: ${currentState.collectedItems.length} / ${activeCase.missions.length}</span>
          </div>

          <div class="flex gap-2 mt-4">
            <button onclick="restartCase()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition min-h-[44px]">
              🔄 Replay Rooms
            </button>
          </div>
        </div>
      `;

      backdrop.classList.remove('hidden');
    }

    function restartCase() {
      currentState.currentMissionIdx = 0;
      currentState.collectedItems = [];
      closeModal();
      loadRoomArchitecture(0);
      updateHUD();
    }

    /* =========================================================================
       7. PROTECTED ADMIN ACCESS & DIRECTOR MODE
       ========================================================================= */

    function handleBadgeClick() {
      badgeClickCount++;
      if (badgeClickTimer) clearTimeout(badgeClickTimer);
      
      badgeClickTimer = setTimeout(() => {
        if (badgeClickCount >= 3) {
          promptAdminLogin();
        }
        badgeClickCount = 0;
      }, 500);
    }

    function promptAdminLogin() {
      const pin = prompt("Enter Admin Passcode for Director Mode Access:");
      if (pin === "admin" || pin === "628" || pin === "1400") {
        playSuccessChime();
        openAdminModal();
      } else if (pin !== null) {
        playErrorBuzz();
        alert("Access Denied: Invalid Admin Passcode");
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        promptAdminLogin();
      }
    });

    function openAdminModal() {
      const backdrop = document.getElementById('modalBackdrop');
      const content = document.getElementById('modalContent');

      content.innerHTML = `
        <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        
        <div class="flex items-center gap-2 text-xs uppercase font-black text-amber-400 tracking-wider mb-1">
          <span>⚙️ Protected Director Mode</span>
        </div>
        <h2 class="text-lg font-black text-white mb-3">Edit Room Architecture</h2>

        <div class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-300 uppercase mb-1 text-[10px]">Case Title</label>
            <input id="adminCaseTitle" type="text" value="${activeCase.title}" class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white font-semibold focus:border-amber-400 focus:outline-none">
          </div>

          <div class="border-t border-slate-800 pt-2">
            <h3 class="font-bold text-amber-400 uppercase mb-2 text-[10px]">3D Chambers (${activeCase.missions.length})</h3>
            <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
              ${activeCase.missions.map((m, idx) => `
                <div class="p-2.5 rounded-lg bg-slate-900/90 border border-slate-800 space-y-1.5">
                  <div class="flex items-center justify-between font-bold text-slate-200 text-[11px]">
                    <span>Room ${idx + 1} Theme:</span>
                    <select id="theme_${idx}" class="bg-slate-800 text-amber-300 rounded px-2 py-1 text-[10px] border border-slate-700">
                      <option value="desert_room" ${m.theme === 'desert_room' ? 'selected' : ''}>Tent Enclosure Room</option>
                      <option value="pavilion_room" ${m.theme === 'pavilion_room' ? 'selected' : ''}>Negotiating Pavilion Room</option>
                      <option value="courtyard_room" ${m.theme === 'courtyard_room' ? 'selected' : ''}>Courtyard Room</option>
                      <option value="gate_room" ${m.theme === 'gate_room' ? 'selected' : ''}>Fortress Gate Room</option>
                      <option value="sanctuary_room" ${m.theme === 'sanctuary_room' ? 'selected' : ''}>Sanctuary Victory Hall</option>
                    </select>
                  </div>
                  <input id="mTitle_${idx}" type="text" value="${m.title}" class="w-full p-1.5 rounded bg-slate-800 border border-slate-700 text-white font-medium text-[11px]">
                </div>
              `).join('')}
            </div>
          </div>

          <div class="flex gap-2 pt-2 border-t border-slate-800">
            <button onclick="saveAdminChanges()" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition min-h-[44px]">
              💾 Save Room Configuration
            </button>
            <button onclick="resetDefaultCase()" class="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs uppercase transition whitespace-nowrap min-h-[44px]">
              Reset Default
            </button>
          </div>
        </div>
      `;

      backdrop.classList.remove('hidden');
    }

    function saveAdminChanges() {
      activeCase.title = document.getElementById('adminCaseTitle').value.trim() || activeCase.title;
      activeCase.missions.forEach((m, idx) => {
        const titleEl = document.getElementById(`mTitle_${idx}`);
        const themeEl = document.getElementById(`theme_${idx}`);
        if (titleEl) m.title = titleEl.value;
        if (themeEl) m.theme = themeEl.value;
      });

      localStorage.setItem('archive_room_case_v1', JSON.stringify(activeCase));
      playSuccessChime();
      alert("Room configurations updated!");
      closeModal();
      loadRoomArchitecture(currentState.currentMissionIdx);
      updateHUD();
    }

    function resetDefaultCase() {
      if (confirm("Reset to default 3D room escape parameters?")) {
        localStorage.removeItem('archive_room_case_v1');
        activeCase = JSON.parse(JSON.stringify(DEFAULT_CASE));
        playSuccessChime();
        closeModal();
        restartCase();
      }
    }

    /* =========================================================================
       8. INITIALIZATION
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      init3D();
      updateHUD();
    });
  </script>
